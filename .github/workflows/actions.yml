name: GitHub Actions
on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Java and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Show Java and Maven versions
        shell: bash
        run: |
          java --version
          mvn --version
      - name: Run unit tests
        shell: bash
        run: |
          mvn -B -ntp test
